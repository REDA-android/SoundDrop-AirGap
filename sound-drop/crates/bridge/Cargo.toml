[package]
name = "sounddrop-bridge"
version = "0.2.0"
edition = "2021"
description = "SoundDrop C-ABI & JNI/Kotlin Foreign Function Interface (FFI) Bridge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sounddrop-crypto = { path = "../crypto" }
sounddrop-protocol = { path = "../protocol" }
sounddrop-modem = { path = "../modem" }
sounddrop-mesh = { path = "../mesh" }
sounddrop-orbital = { path = "../orbital" }
jni = { version = "0.21", default-features = false }
libc = "0.2"
thiserror = "1.0"

[dev-dependencies]
