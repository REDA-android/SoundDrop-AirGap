[package]
name = "sounddrop-crypto"
version = "0.2.0"
edition = "2021"

[dependencies]
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
thiserror = "1.0"
